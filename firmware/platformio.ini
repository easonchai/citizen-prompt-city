; Citizen badge firmware for ESP32-2424S012C (ESP32-C3, GC9A01 240x240 round, CST816S touch).
;
; Board facts, from rzeldent/platformio-espressif32-sunton boards/esp32-2424S012C.json:
;   MCU esp32c3, 4 MB flash QIO 80 MHz, CPU 160 MHz, 327,680 bytes RAM, no PSRAM,
;   USB CDC on boot (ARDUINO_USB_MODE=1, ARDUINO_USB_CDC_ON_BOOT=1).
;   GC9A01 on SPI2: MOSI 7, SCLK 6, CS 10, DC 2, no MISO, no RST, BGR, mirror X, 80 MHz pixel clock.
;   Backlight GPIO 3 (active high). CST816S on I2C: SDA 4, SCL 5, RST 1, INT 0, addr 0x15, 400 kHz.
; We use the generic esp32-c3-devkitm-1 board and override what differs.
;
; How the core gets in:
;   build_src_filter compiles every ../core/*.c (paths are relative to src/) except libc_shim.c,
;   which is the wasm-only libc stand-in (CZ_FREESTANDING) and would clash with newlib here.
;   ../stub_core.c is always compiled but is empty once core/citizen.c exists (it checks
;   __has_include("citizen.c") via -I../core), so the real core is picked up with no edit here.

[env:citizen]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
; F11: two 1,966,080-byte OTA app slots (was huge_app.csv, 3 MB, no OTA). nvs stays at 0x9000/0x5000,
; so Preferences (save blob, WiFi, settings) survive the switch.
board_build.partitions = min_spiffs.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 160000000L
board_upload.flash_size = 4MB
monitor_speed = 115200
lib_deps = lovyan03/LovyanGFX@1.2.7
build_src_filter = +<*> +<../../core/*.c> -<../../core/libc_shim.c> +<../stub_core.c>
build_flags =
    -I../core
    -DCZ_VERSION=\"1.3.0\"
    ; the server the badge talks to; point it at your own deployment to run your own city
    -DCZ_DEFAULT_BASE=\"https://connect.prmpt.city\"
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLCD_MOSI=7
    -DLCD_SCLK=6
    -DLCD_CS=10
    -DLCD_DC=2
    -DLCD_BL=3
    -DLCD_SPI_HZ=40000000
    ; F10 panel flags, check on hardware day one:
    ;   -DCZ_RGB_ORDER=0  set to 1 if red and blue are swapped (panel is BGR)
    ;   -DCZ_ROTATION=0   0..3 rotate, 4..7 the mirrored variants (panel is mirror X)
    -DCZ_RGB_ORDER=0
    -DCZ_ROTATION=0
    ; F4: uncomment if deep-sleep wake on touch INT is unreliable; uses light sleep + 2 s timer instead
    ;   -DCZ_LIGHT_SLEEP_FALLBACK
    -DTOUCH_SDA=4
    -DTOUCH_SCL=5
    -DTOUCH_RST=1
    -DTOUCH_INT=0
    -DTOUCH_ADDR=0x15
    -DTOUCH_HZ=400000
