<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citizen simulator</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#2a313c;--fg:#e6edf3;--dim:#8b949e;--gold:#e8b04a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:32px;flex-wrap:wrap}
#bezel{width:760px;height:760px;border-radius:50%;background:radial-gradient(#1b1b1b,#050505);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #222,0 20px 60px #000a;flex:none}
#screen{width:720px;height:720px;border-radius:50%;display:block;touch-action:none;cursor:pointer;background:#000}
#ctl{width:340px;display:flex;flex-direction:column;gap:14px}
h1{font-size:16px;margin:0;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
label{color:var(--dim);font-size:12px;display:flex;flex-direction:column;gap:3px}
input,select,textarea,button{background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
textarea{resize:vertical;height:56px}
button{cursor:pointer}button:hover{border-color:var(--gold)}
.row{display:flex;gap:8px}.row>*{flex:1}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}dt{color:var(--dim)}dd{margin:0;font-variant-numeric:tabular-nums}
#err{color:#f85149}
</style></head><body>
<div id="bezel"><canvas id="screen" width="720" height="720"></canvas></div>
<div id="ctl">
  <h1>Citizen simulator</h1><div id="err"></div>
  <section>
    <dl>
      <dt>Sim time</dt><dd id="r-time"></dd>
      <dt>Screen</dt><dd id="r-screen"></dd>
      <dt>Hearts</dt><dd id="r-hearts"></dd>
      <dt>Pose</dt><dd id="r-pose"></dd>
      <dt>Hunger</dt><dd id="r-hunger"></dd>
      <dt>Wants sleep</dt><dd id="r-sleep"></dd>
      <dt>Dirty/s</dt><dd id="r-fps"></dd>
    </dl>
    <label>Speed <select id="speed"><option value="1">1x</option><option value="10">10x</option><option value="60">60x</option><option value="600">600x</option><option value="3600">3600x</option></select></label>
  </section>
  <section>
    <label>Creature <select id="creature"><option value="0">Tapir</option><option value="1">Hornbill</option><option value="2">Tiger</option></select></label>
    <label>Name <input id="name" value="TENUK" maxlength="10"></label>
    <label>Prompt <textarea id="prompt">You are a skeptical ops lead who eats clean data.</textarea></label>
    <label>QR url <input id="qr" value="https://prmpt.city/c/tenuk"></label>
    <button id="apply">Apply content</button>
  </section>
  <section>
    <label>Message <input id="msg" value="Welcome to KL!"></label>
    <div class="row"><button id="send">Send message</button><button id="checkin">Check in (KL)</button></div>
    <div class="row"><button id="save">Save</button><button id="reset">Reset</button></div>
    <label>Slept seconds <input id="slept" type="number" value="3600" min="0"></label>
    <button id="wake">Wake from sleep</button>
  </section>
</div>
<script type="module" src="sim.js"></script>
</body></html>
